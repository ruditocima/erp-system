<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise WMS - Warehouse Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        slate: { 850: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full font-sans text-slate-800 antialiased" x-data="wmsApp()">

    <div class="min-h-full flex flex-col">
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-primary-600 p-2 rounded-lg text-white">
                        <i data-lucide="box" class="w-6 h-6"></i>
                    </div>
                    <span class="font-bold text-lg tracking-wide">Enterprise WMS</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-slate-300 hidden sm:inline">Warehouse Management System</span>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">Riwayat Transaksi</h1>
                        <p class="text-sm text-slate-500">Kelola dan lihat rincian barang masuk/keluar berdasarkan nomor dokumen.</p>
                    </div>
                </div>

                <div class="bg-white shadow-sm rounded-xl border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-slate-200">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">No. Dokumen</th>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Tanggal</th>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Tipe</th>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Gudang</th>
                                    <th class="px-6 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Project</th>
                                    <th class="px-6 py-3 text-center text-xs font-semibold text-slate-600 uppercase tracking-wider">Total Item</th>
                                    <th class="px-6 py-3.5 text-right text-xs font-semibold text-slate-600 uppercase tracking-wider">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 bg-white">
                                <template x-for="trx in transactionList" :key="trx.noDocument">
                                    <tr class="hover:bg-slate-50 transition-colors">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900" x-text="trx.noDocument"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600" x-text="trx.tanggal"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                                            <span class="px-2.5 py-1 text-xs font-semibold rounded-full"
                                                  :class="trx.tipe === 'IN' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'"
                                                  x-text="trx.tipe">
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600" x-text="trx.gudang"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600" x-text="trx.project"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-center text-slate-600 font-semibold" x-text="trx.items ? trx.items.length : 0"></td>
                                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                                            <button @click="openDetailTransaction(trx)" class="inline-flex items-center text-primary-600 hover:text-primary-900 bg-primary-50 hover:bg-primary-100 px-2.5 py-1 rounded-md transition-colors" title="Lihat Rincian Item">
                                                <i data-lucide="eye" class="w-4 h-4 mr-1"></i> Detail
                                            </button>
                                            <button @click="deleteTransaction(trx.noDocument)" class="text-rose-600 hover:text-rose-900 bg-rose-50 hover:bg-rose-100 p-1.5 rounded-md transition-colors" title="Hapus Transaksi">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                                <template x-if="transactionList.length === 0">
                                    <tr>
                                        <td colspan="7" class="px-6 py-8 text-center text-sm text-slate-500">Belum ada data transaksi.</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div x-cloak x-show="isDetailModalOpen" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="isDetailModalOpen" 
                 x-transition:enter="ease-out duration-300" 
                 x-transition:enter-start="opacity-0" 
                 x-transition:enter-end="opacity-100" 
                 x-transition:leave="ease-in duration-200" 
                 x-transition:leave-start="opacity-100" 
                 x-transition:leave-end="opacity-0" 
                 class="fixed inset-0 bg-slate-500 bg-opacity-75 transition-opacity" 
                 @click="closeDetailTransaction()"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <div x-show="isDetailModalOpen" 
                 x-transition:enter="ease-out duration-300" 
                 x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                 x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
                 x-transition:leave="ease-in duration-200" 
                 x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" 
                 x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                 class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
                
                <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-bold" id="modal-title">Rincian Dokumen Transaksi</h3>
                        <p class="text-xs text-slate-300" x-text="selectedTransaction ? 'No. Dokumen: ' + selectedTransaction.noDocument : ''"></p>
                    </div>
                    <button @click="closeDetailTransaction()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="p-6 space-y-4">
                    <template x-if="selectedTransaction">
                        <div class="space-y-4">
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm">
                                <div>
                                    <span class="block text-xs text-slate-500">Tanggal</span>
                                    <span class="font-semibold text-slate-800" x-text="selectedTransaction.tanggal"></span>
                                </div>
                                <div>
                                    <span class="block text-xs text-slate-500">Tipe</span>
                                    <span class="font-semibold" :class="selectedTransaction.tipe === 'IN' ? 'text-emerald-600' : 'text-rose-600'" x-text="selectedTransaction.tipe"></span>
                                </div>
                                <div>
                                    <span class="block text-xs text-slate-500">Gudang</span>
                                    <span class="font-semibold text-slate-800" x-text="selectedTransaction.gudang"></span>
                                </div>
                                <div>
                                    <span class="block text-xs text-slate-500">Project</span>
                                    <span class="font-semibold text-slate-800" x-text="selectedTransaction.project"></span>
                                </div>
                            </div>

                            <div>
                                <h4 class="text-sm font-semibold text-slate-700 mb-2">Daftar Barang Termasuk:</h4>
                                <div class="border border-slate-200 rounded-lg overflow-hidden max-h-64 overflow-y-auto">
                                    <table class="min-w-full divide-y divide-slate-200 text-sm">
                                        <thead class="bg-slate-100">
                                            <tr>
                                                <th class="px-4 py-2 text-left font-semibold text-slate-600">Kode Barang</th>
                                                <th class="px-4 py-2 text-left font-semibold text-slate-600">Nama Barang</th>
                                                <th class="px-4 py-2 text-center font-semibold text-slate-600">Qty</th>
                                                <th class="px-4 py-2 text-left font-semibold text-slate-600">Satuan</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-200 bg-white">
                                            <template x-for="item in (selectedTransaction.items || [])" :key="item.kodeBarang">
                                                <tr>
                                                    <td class="px-4 py-2 font-medium text-slate-900" x-text="item.kodeBarang"></td>
                                                    <td class="px-4 py-2 text-slate-700" x-text="item.namaBarang"></td>
                                                    <td class="px-4 py-2 text-center font-semibold text-slate-800" x-text="item.qty"></td>
                                                    <td class="px-4 py-2 text-slate-600" x-text="item.satuan"></td>
                                                </tr>
                                            </template>
                                            <template x-if="!selectedTransaction.items || selectedTransaction.items.length === 0">
                                                <tr>
                                                    <td colspan="4" class="px-4 py-4 text-center text-slate-400">Tidak ada rincian item barang.</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="bg-slate-50 px-6 py-3 flex justify-end">
                    <button @click="closeDetailTransaction()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition-colors">
                        Tutup
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function wmsApp() {
            return {
                // State Data Asli (dipertahankan penuh)
                gudangList: [],
                projectList: [],
                barangList: [],
                
                // State Data Transaksi (Pastikan struktur data memiliki array 'items')
                transactionList: [
                    {
                        noDocument: 'TRX-IN-2026-001',
                        tanggal: '2026-06-01',
                        tipe: 'IN',
                        gudang: 'GD-UTAMA',
                        project: 'PRJ-A',
                        items: [
                            { kodeBarang: 'BRG-001', namaBarang: 'Semen Gresik 50kg', qty: 100, satuan: 'Sak' },
                            { kodeBarang: 'BRG-002', namaBarang: 'Besi Beton 10mm', qty: 50, satuan: 'Batang' }
                        ]
                    },
                    {
                        noDocument: 'TRX-OUT-2026-002',
                        tanggal: '2026-06-02',
                        tipe: 'OUT',
                        gudang: 'GD-UTAMA',
                        project: 'PRJ-B',
                        items: [
                            { kodeBarang: 'BRG-003', namaBarang: 'Pipa PVC 3 inch', qty: 25, satuan: 'Batang' }
                        ]
                    }
                ],

                // ==========================================
                // STATE & METHOD BARU UNTuk MODAL DETAIL
                // ==========================================
                isDetailModalOpen: false,
                selectedTransaction: null,

                openDetailTransaction(trx) {
                    this.selectedTransaction = trx;
                    this.isDetailModal`Open = true;
                    // Re-init lucide icons inside modal if needed
                    setTimeout(() => lucide.createIcons(), 100);
                },

                closeDetailTransaction() {
                    this.isDetailModalOpen = false;
                    this.selectedTransaction = null;
                },

                // Method Asli (Tidak diubah agar fungsionalitas lain aman)
                deleteTransaction(noDocument) {
                    if(confirm(`Hapus transaksi dengan No Document ${noDocument}?`)) {
                        let idx = this.transactionList.findIndex(t => t.noDocument === noDocument);
                        if(idx !== -1) this.transactionList.splice(idx, 1);
                        alert('Transaksi berhasil dihapus!');
                    }
                },

                showToast(message, type) {
                    // Placeholder toast bawaan sistem Anda
                    console.log(`[${type.toUpperCase()}]: ${message}`);
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => lucide.createIcons(), 200);
        });
    </script>
</body>
</html>
