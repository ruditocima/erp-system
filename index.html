<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise WMS v2.0 &mdash; Warehouse Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        slate: { 850: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <style>
        [x-cloak] { display: none !important; }
        @media print {
            body { background-color: white !important; margin: 0; padding: 0; }
            body > div:not(#printable-surat-jalan) { display: none !important; }
            #printable-surat-jalan { display: block !important; width: 100%; background: white; color: black; }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
    <base target="_blank">
</head>
<body class="h-full text-slate-800 text-xs antialiased selection:bg-indigo-500 selection:text-white" x-data="wmsApp()">

    <div class="fixed top-4 right-4 z-50 space-y-2 no-print" x-cloak>
        <template x-for="toast in toasts" :key="toast.id">
            <div :class="toast.type === 'success' ? 'bg-emerald-600 text-white' : (toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-800 text-white')"
                 class="px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-xs font-medium animate-enter">
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <div x-show="!isLoggedIn" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm no-print" x-cloak>
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-md p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 mb-3">
                    <i data-lucide="warehouse" class="w-6 h-6"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-900">Warehouse Management System</h2>
                <p class="text-slate-500 text-xs mt-1">Silakan masuk ke sistem (GitHub + Supabase)</p>
            </div>
            <form @submit.prevent="login()" class="space-y-4">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Nama Pengguna</label>
                    <input type="text" x-model="username" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Masukkan nama Anda...">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Peran Akses (Role)</label>
                    <select x-model="role" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Admin">Admin (Full Access & Master Data)</option>
                        <option value="Approver">Approver (Approval Transaksi)</option>
                        <option value="Requester">Requester (Input Transaksi)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors text-xs shadow-sm">Masuk ke Sistem</button>
            </form>
        </div>
    </div>

    <div x-show="isLoggedIn" class="min-h-full flex flex-col" x-cloak>
        <header class="bg-slate-900 text-white sticky top-0 z-40 border-b border-slate-800 shadow-sm no-print">
            <div class="px-4 py-2.5 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 p-1.5 rounded-lg text-white"><i data-lucide="boxes" class="w-4 h-4"></i></div>
                    <div>
                        <h1 class="font-bold text-sm tracking-wide">ENTERPRISE WMS</h1>
                        <p class="text-2xs text-slate-400">Cloud Sync &bull; GitHub & Supabase Ready</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <div class="font-semibold text-white" x-text="username"></div>
                        <div class="text-2xs text-indigo-400 uppercase tracking-wider font-medium" x-text="role"></div>
                    </div>
                    <button @click="logout()" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-red-400 transition-colors" title="Keluar"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
            </div>
            <nav class="flex space-x-1 px-4 bg-slate-900/90 overflow-x-auto text-xs border-t border-slate-800">
                <template x-for="tab in tabs" :key="tab.id">
                    <button @click="switchTab(tab.id)" :class="activeTab === tab.id ? 'bg-indigo-600 text-white font-medium' : 'text-slate-300 hover:bg-slate-800 hover:text-white'" class="px-3 py-2 transition-colors whitespace-nowrap flex items-center space-x-1.5">
                        <i :data-lucide="tab.icon" class="w-3.5 h-3.5"></i>
                        <span x-text="tab.name"></span>
                    </button>
                </template>
            </nav>
        </header>

        <main class="flex-1 p-4 max-w-7xl mx-auto w-full space-y-4">
            <template x-if="activeTab === 'dashboard'">
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="font-bold text-slate-800 text-sm">Dashboard Overview</h2>
                        <p class="text-slate-500 text-2xs">Sistem WMS aktif terhubung dengan penyimpanan cloud Supabase.</p>
                    </div>
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center space-x-3">
                            <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-lg"><i data-lucide="package" class="w-5 h-5"></i></div>
                            <div><div class="text-2xs text-slate-500">Total SKU</div><div class="text-lg font-bold text-slate-900" x-text="barangList.length"></div></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center space-x-3">
                            <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="warehouse" class="w-5 h-5"></i></div>
                            <div><div class="text-2xs text-slate-500">Total Gudang</div><div class="text-lg font-bold text-slate-900" x-text="gudangList.length"></div></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center space-x-3">
                            <div class="p-2.5 bg-amber-50 text-amber-600 rounded-lg"><i data-lucide="clock" class="w-5 h-5"></i></div>
                            <div><div class="text-2xs text-slate-500">Pending Approval</div><div class="text-lg font-bold text-slate-900" x-text="pendingCount"></div></div>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center space-x-3">
                            <div class="p-2.5 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="layers" class="w-5 h-5"></i></div>
                            <div><div class="text-2xs text-slate-500">Total Stok Tersedia</div><div class="text-lg font-bold text-slate-900" x-text="totalStokGlobal"></div></div>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="activeTab === 'master_barang'">
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <div>
                            <h2 class="font-bold text-slate-800 text-sm">Master Barang</h2>
                            <p class="text-slate-500 text-2xs">Kelola data material dan stok minimum.</p>
                        </div>
                        <button x-show="role === 'Admin'" @click="openModal('barang')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium">Tambah Barang</button>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 border-b border-slate-200 font-semibold">
                                    <th class="p-3">Kode</th><th class="p-3">Kategori</th><th class="p-3">Nama Barang</th><th class="p-3">Satuan</th><th class="p-3 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                <template x-for="item in filteredBarang" :key="item.kode">
                                    <tr class="hover:bg-slate-50/50">
                                        <td class="p-3 font-mono text-indigo-600 font-bold" x-text="item.kode"></td>
                                        <td class="p-3" x-text="item.kategori"></td>
                                        <td class="p-3 font-medium text-slate-900" x-text="item.nama"></td>
                                        <td class="p-3" x-text="item.satuan"></td>
                                        <td class="p-3 text-right space-x-1">
                                            <button @click="editBarang(item)" class="text-slate-400 hover:text-indigo-600">Edit</button>
                                            <button @click="confirmDelete('barang', item.kode)" class="text-slate-400 hover:text-red-600">Hapus</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>
        </main>
    </div>

    <script src="supabaseClient.js"></script>
    <script src="app.js"></script>
</body>
</html>
